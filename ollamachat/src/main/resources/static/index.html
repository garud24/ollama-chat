<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OllamaChat</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="chat-card">
    <header>
      <p class="eyebrow">YOUR LOCAL AI</p>
      <h1>OllamaChat</h1>
      <p class="subtitle">Ask a question. Get a thoughtful reply.</p>
    </header>

    <form id="chat-form">
      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="5" placeholder="What would you like to know?" required></textarea>
      <div class="form-footer">
        <span>Each message is independent.</span>
        <button id="send-button" type="submit">Send message</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>

    <section id="reply-section" aria-labelledby="reply-heading" hidden>
      <h2 id="reply-heading">Ollama’s reply</h2>
      <div id="reply"></div>
    </section>
  </main>
</body>
</html>
